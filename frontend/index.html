<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./neo-icon.svg" />
    <link rel="icon" type="image/x-icon" href="./neo-icon.ico" />
    <link rel="apple-touch-icon" href="./neo-apple-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Apply persisted theme before paint to avoid a flash of the wrong theme -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("neo-theme");
          if (t !== "light" && t !== "dark") t = "dark";
          var el = document.documentElement;
          el.classList.remove("light", "dark");
          el.classList.add(t);
          el.style.colorScheme = t;
        } catch (e) {}
      })();
    </script>
    <!--
      Suppress Tawk.to's own launcher + "We Are Here!" attention grabber before
      first paint.

      Tawk appends a <div> with a RANDOM id (no class, no title) whose iframes
      are all src="about:blank", and it renders that ~10s after load. Hiding it
      from JS can only ever react after it is already on screen, which is the
      flash of the removed widget users were seeing on every reload. This rule
      is part of the document, so the widget is never painted at all.

      Our own launcher lives inside #root and is unaffected. The
      `html.neo-chat-open` gate (set by components/TawkChat.tsx) hands the
      corner back to Tawk for the duration of an open conversation.
    -->
    <style>
      html:not(.neo-chat-open) body > div[id]:not(#root):has(> iframe),
      html:not(.neo-chat-open) body > div[data-neo-tawk-hidden="1"] {
        display: none !important;
      }
    </style>
    <meta
      name="description"
      content="Neo Automation Pvt. Ltd. — Premium automation solutions, industrial tools & authorised distributor of Atlas Copco, GESIPA, eepos, GEDORE, PFERD & John Guest."
    />
    <meta name="theme-color" content="#ed1c24" />
    <title>Neo Automation — Engineering Tomorrow's Industry</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://api.fontshare.com/v2/css?f[]=clash-display@400,500,600,700&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
